name: CI/CD - WEB-Jouskaio.me

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-


      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Run Tests
        run: yarn test

  publish-ui:
    name: Publish UI Package
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile


      - name: Build UI Package
        run: yarn workspace @jouskaio/ui build

      - name: Publish to NPM
        id: npm-publish
        run: |
          cd packages/ui
          VERSION=$(node -p "require('./package.json').version")
          # Vérifier si la version existe déjà sur NPM sans faire échouer le script
          if npm show @jouskaio/ui@$VERSION version > /dev/null 2>&1; then
            echo "Version $VERSION already exists on NPM. Skipping publish."
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "Publishing version $VERSION..."
            npm publish --access public
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Discord Notification on Success
        if: success()
        run: |
          VERSION=$(node -p "require('./packages/ui/package.json').version")
          MESSAGE="📦 Package **@jouskaio/ui** (v$VERSION) successfully published on NPM !"
          if [[ "${{ steps.npm-publish.outputs.skipped }}" == "true" ]]; then
            MESSAGE="ℹ️ Package **@jouskaio/ui** already up to date on NPM (v$VERSION)."
          fi
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"content\": \"$MESSAGE [Voir les logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
          "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Discord Notification on Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"content\": \"🚨 Failed to publish package **@jouskaio/ui** on NPM ! [Voir les logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
          "${{ secrets.DISCORD_WEBHOOK_URL }}"

  deploy:
    name: Deployment
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WireGuard
        run: |
          sudo apt-get update
          sudo apt-get install -y wireguard wireguard-tools

      - name: Create WireGuard config
        run: |
          echo "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf

      - name: Start WireGuard
        run: |
          sudo wg-quick up wg0
          sudo wg show

      - name: Test VPN connectivity
        run: |
          ping -c 2 ${{ secrets.SERVER_HOST }}

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on remote server
        run: |
          ssh ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} \
          "cd /home/user/Documents/jouskaio.me/WEB-Jouskaio.me && git fetch origin && git reset --hard origin/main && chmod +x deploy/deploy-jouskaio.sh && ./deploy/deploy-jouskaio.sh"

      - name: Stop WireGuard
        if: always()
        run: |
          sudo wg-quick down wg0 || true

      - name: Discord Notification on Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"content\": \"✅ Deployment of **WEB-Jouskaio.me** successfully completed on \`${{ github.ref_name }}\` ! [Voir les logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
          "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Discord Notification on Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"content\": \"🚨 Deployment of **WEB-Jouskaio.me** failed on \`${{ github.ref_name }}\` ! [Voir les logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
          "${{ secrets.DISCORD_WEBHOOK_URL }}"
