name: CI/CD - WEB-Jouskaio.me

on:
    push:
        branches:
            - main

concurrency:
    group: deploy-web-jouskaio-main
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install WireGuard
              run: |
                  sudo apt-get update
                  sudo apt-get install -y wireguard wireguard-tools

            - name: Create WireGuard config
              run: |
                  echo "${{ secrets.WG_CONFIG }}" | sudo tee /etc/wireguard/wg0.conf > /dev/null
                  sudo chmod 600 /etc/wireguard/wg0.conf

            - name: Start WireGuard
              run: |
                  sudo wg-quick up wg0
                  sudo wg show

            - name: Test VPN connectivity
              run: |
                  ping -c 2 ${{ secrets.SERVER_HOST }}

            - name: Prepare SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

            - name: Test SSH connection
              run: |
                  ssh ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} "whoami && hostname"

            - name: Deploy on remote server
              run: |
                  ssh ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} \
                  "/home/user/Documents/jouskaio.me/deploy/deploy-jouskaio.sh"

            - name: Stop WireGuard
              if: always()
              run: |
                  sudo wg-quick down wg0 || true

            - name: Discord Notification on Success
              if: success()
              run: |
                  curl -H "Content-Type: application/json" \
                  -X POST \
                  -d "{\"content\": \"ℹ️ Deployment of **WEB-Jouskaio.me** successfully completed on \`${{ github.ref_name }}\` ! [Voir les logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
                  "${{ secrets.DISCORD_WEBHOOK_URL }}"

            - name: Discord Notification on Failure
              if: failure()
              run: |
                  curl -H "Content-Type: application/json" \
                  -X POST \
                  -d "{\"content\": \"🚨 Deployment of **WEB-Jouskaio.me** failed on \`${{ github.ref_name }}\` ! [Voir les logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})\"}" \
                  "${{ secrets.DISCORD_WEBHOOK_URL }}"
